# Site settings
title: Jonathan Frei - Based on a true story
description: "Personal site and blog of Jonathan Frei. Short posts, long-form articles, and notes."
url: "https://jonathanfrei.com"
baseurl: ""

# Author
author:
  name: Jonathan Frei
  email: hi@jonathanfrei.com

# Build settings
markdown: kramdown
# Trailing slash → directory/index.html so GitHub Pages serves HTML
# (extensionless files download as application/octet-stream)
permalink: /:categories/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate-v2

# Pagination (blog index + tag autopages)
pagination:
  enabled: true
  per_page: 50
  permalink: "/page/:num/"
  title: ":title – page :num of :max"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# Auto-generated paginated tag pages (replaces jekyll-archives tags)
autopages:
  enabled: true
  tags:
    layouts:
      - tag
    title: "Tag: :tag"
    # Trailing slash → directory/index.html (GitHub Pages HTML, not download)
    # slugify mode default matches Liquid | slugify (spaces → hyphens)
    permalink: "/tags/:tag/"
    enabled: true
    slugify:
      mode: default
      cased: true
  categories:
    enabled: false
  collections:
    enabled: false

# Month archive pages only (tags handled by paginate-v2 autopages)
jekyll-archives:
  enabled:
    - month
  layouts:
    month: archive
  permalinks:
    month: /archive/:year/:month/

# Exclude from processing (including obfuscated drafts folder)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - AGENTS.md
  - _x7k9p
  - .gitignore

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Jonathan Frei
  # Historical imports: no category segment in URL; media lives at /media/
  - scope:
      path: "_posts/v1-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title/
      categories: []
  - scope:
      path: "_posts/v2-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title/
      categories: []
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# SEO / social (basic)
twitter:
  username: jonathanfrei

# Feed settings – drafts never included because excluded from build
feed:
  path: feed.xml
