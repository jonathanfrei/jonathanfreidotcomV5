# Site settings
title: Jonathan Frei - Based on a true story
description: "Personal site and blog of Jonathan Frei. Short posts, long-form articles, and notes."
url: "https://jonathanfrei.com"
baseurl: ""

# Author
author:
  name: Jonathan Frei
  email: hi@jonathanfrei.com

# Build settings
markdown: kramdown
# No trailing slash on post URLs (#32) — e.g. /2026/08/05/embed-examples
permalink: /:categories/:year/:month/:day/:title

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# Tag / category permalinks (no trailing slash — #32)
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: tag
  permalinks:
    tag: /tags/:name
    category: /categories/:name

# Exclude from processing (including obfuscated drafts folder)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - _x7k9p
  - .gitignore

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Jonathan Frei
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# SEO / social (basic)
twitter:
  username: jonathanfrei

# Feed settings – drafts never included because excluded from build
feed:
  path: feed.xml
