# Site settings
title: Jonathan Frei
description: "Personal site and blog of Jonathan Frei. Short posts, long-form articles, and notes."
url: "https://jonathanfrei.com"
baseurl: ""

# Interpret and display dates in Eastern Time (issue #180). GitHub Actions
# runners are UTC; without this, a TZ-aware evening date such as
# 2026-08-12T21:17:00-04:00 becomes August 13 in permalinks and bylines.
timezone: America/New_York

# Publish future-dated posts and link documents on the next build (#142).
# Without this, a same-day afternoon link (e.g. 14:30 ET) is omitted from
# _site when CI runs earlier that morning, so its permalink file is missing.
future: true

# Author
author:
  name: Jonathan Frei
  email: hi@jonathanfrei.com

# Build settings
markdown: kramdown
# Rouge syntax highlighting (Jekyll default; faster than CodeRay, #195)
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
  # Allow Markdown inside HTML blocks (editorial components, #144)
  parse_block_html: true
# No trailing slash: Jekyll writes .html files that GitHub Pages serves at the
# clean path (/about, not /about/). Extensionless files would download as
# application/octet-stream; .html does not. See issue #63.
permalink: /:year/:month/:day/:title

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-relative-links

# Books: nested markdown under _books/<book-slug>/ (_plugins/books.rb).
# Filename 001- prefixes are sort keys; permalinks use slugs only.
collections:
  books:
    output: true
    permalink: /books/:path

# Relative links: convert Markdown .md links to rendered permalinks (#94)
relative_links:
  enabled: true
  collections: true

# Pagination for the custom /blog stream generator (`_plugins/stream_pages.rb`).
# Later pages use directories so /blog/page/N/ resolves to index.html.
pagination:
  enabled: true
  per_page: 100
  permalink: "/page/:num/"
  title: ":title – page :num of :max"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# /tags index lists tags with at least this many posts (issue #140).
# Individual /tags/:name archives are not generated; chips use /tags?tag= (#209).
tag_archive_min_posts: 2

# Post metadata automation (issue #75). See AGENTS.md front-matter contract.
# last_modified_at: explicit front matter wins; else git log (needs full history in CI).
post_metadata:
  git_last_modified: true
  words_per_minute: 200

# Precomputed search / taxonomy / archive indexes (issue #195).
# Built once in _plugins/site_index.rb; templates dump these arrays.
site_index:
  excerpt_chars: 140

# Month archive pages only. Tags and categories use query-driven index pages.
# Must use trailing slash → directory/index.html. Without it, jekyll-archives
# writes extensionless files (archive/2016/01) that GH Pages downloads.
jekyll-archives:
  enabled:
    - month
  layouts:
    month: archive
  permalinks:
    month: /archive/:year/:month/

# Archive media lives on S3 (media.jonathanfrei.com), not in the Pages artifact
# (deploy-pages 10-minute timeout). Production rewrites media/… to:
#   https://media.jonathanfrei.com/v{2,3}-archive/media/…
# Optional local mode still publishes under /media/ if _posts/v*-archive/media
# trees remain in the checkout. Override with ARCHIVE_MEDIA_MODE=cdn|local.
# See issues #68 (offload), #170 (S3).
#
# Image optimization (wsrv.nl WebP + srcset) applies to:
#   - Own site images (archive media + S3 /assets/img/ + in-repo /assets/) — issue #90
#   - Hotlinked third-party images in post HTML — issue #116
archive_media:
  mode: auto
  cdn_base: "https://media.jonathanfrei.com"
  # PageSpeed: resize + WebP via wsrv.nl (full-res preserved on data-full-src).
  # quality 85 is near-lossless for photos; widths cover 1x–2x of the 36em measure.
  # sizes must match display: 100vw when images full-bleed on small
  # screens (#202), 36em (--measure) on larger screens (#173).
  # Applies to archive media, /assets/, and hotlinked external images.
  optimize:
    enabled: auto
    proxy: "https://wsrv.nl"
    quality: 85
    widths: [480, 768, 1100]
    sizes: "(max-width: 40em) 100vw, 36em"
    # When true, rewrite http(s) third-party <img> src through the proxy (#116)
    hotlink: true

# Production /assets (CSS, JS, favicons) via jsDelivr's GitHub CDN.
# Generated /assets/css/core.css maps to _includes/main.css (the file in git).
# editorial.css / book.css map the same way (see AssetCdn::SOURCE_MAP).
# Pinned to the build commit so deploys are not stuck on the @main cache.
# Origin copies still write to _site/assets for local serve. ASSETS_CDN=off
# forces origin URLs. Local `jekyll serve` stays on /assets.
assets_cdn:
  enabled: auto
  host: "https://cdn.jsdelivr.net"
  repo: "jonathanfrei/jonathanfreidotcomV5"

# Static HTML drop-ins (issue #88): top-level *.html under each root publish at
# /{root}/{slug} (no trailing slash). Sibling folders hold assets only.
# Example: editorial/spacex-earnings.html → /editorial/spacex-earnings
# Future roots (articles, long-form-writing) can be added here.
static_html:
  roots:
    - _pages/editorial

# Root-level pages live under _pages/ (issue #161). Underscore dirs are
# excluded by default; include forces Jekyll to read them as pages.
# Permalinks: front matter wins; otherwise _plugins/pages_dir.rb maps
# _pages/about.md → /about and _pages/services/x.md → /services/x.
include:
  - _pages

# Exclude source and tooling files from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - AGENTS.md
  - scripts
  - assets/deprecated
  - .gitignore
  # Residual local media trees (safe to delete once S3 is confirmed, #170).
  # Excluded so date-prefixed .jpg names are not read as posts.
  - _posts/v1-archive/media
  - _posts/v2-archive/media
  - _posts/v3-archive/media

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Jonathan Frei
  # Historical imports: no category segment in URL; media on S3 (#170)
  # categories: [] keeps permalink clean while still allowing explicit category
  # in front matter if desired for /categories?category= filters
  - scope:
      path: "_posts/v1-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: [v1-archive]
  - scope:
      path: "_posts/v2-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: [v2-archive]
  - scope:
      path: "_posts/v3-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: [v3-archive]
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: "_books"
      type: "books"
    values:
      layout: book
      # No default author. Show a byline only when book-home front matter
      # sets author: (copied to chapters by _plugins/books.rb). #277

# SEO / social (basic)
twitter:
  username: jonathanfrei

# Feed settings. jekyll-feed writes an unused file; /feed.xml is authored below.
# jekyll-feed writes an unused file; /feed.xml is the authored mixed feed.
feed:
  path: jekyll-feed-unused.xml
  excerpt_only: false
