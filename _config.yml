# Site settings
title: Jonathan Frei - Based on a true story
description: "Personal site and blog of Jonathan Frei. Short posts, long-form articles, and notes."
url: "https://jonathanfrei.com"
baseurl: ""

# Author
author:
  name: Jonathan Frei
  email: hi@jonathanfrei.com

# Build settings
markdown: kramdown
# No trailing slash: Jekyll writes .html files that GitHub Pages serves at the
# clean path (/about, not /about/). Extensionless files would download as
# application/octet-stream; .html does not. See issue #63.
permalink: /:categories/:year/:month/:day/:title

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate-v2

# Pagination (blog index + tag autopages)
pagination:
  enabled: true
  per_page: 50
  permalink: "/page/:num"
  title: ":title – page :num of :max"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# Auto-generated paginated tag pages (replaces jekyll-archives tags)
autopages:
  enabled: true
  tags:
    layouts:
      - tag.html
    title: "Tag: :tag"
    # No trailing slash — same rationale as site permalink (#63)
    # slugify mode default matches Liquid | slugify (spaces → hyphens)
    permalink: "/tags/:tag"
    enabled: true
    slugify:
      mode: default
      cased: true
  categories:
    enabled: false
  collections:
    enabled: false

# Month archive pages only (tags handled by paginate-v2 autopages)
# Must use trailing slash → directory/index.html. Without it, jekyll-archives
# writes extensionless files (archive/2016/01) that GH Pages downloads.
jekyll-archives:
  enabled:
    - month
  layouts:
    month: archive
  permalinks:
    month: /archive/:year/:month/

# Archive media: keep files in-repo under _posts/v{2,3}-archive/media but do
# not ship them in the GitHub Pages artifact (deploy-pages 10-minute timeout).
# Production (JEKYLL_ENV=production) rewrites URLs to jsDelivr; local serve
# still publishes under /media/. Override with ARCHIVE_MEDIA_MODE=cdn|local.
# See issue #68.
archive_media:
  mode: auto
  cdn_base: "https://cdn.jsdelivr.net/gh/jonathanfrei/jonathanfreidotcomV5@main"
  # PageSpeed: resize + WebP via wsrv.nl (full-res stays on jsDelivr for <a href>).
  # quality 85 is near-lossless for photos; widths cover 1x–2x of the 33em measure.
  optimize:
    enabled: auto
    proxy: "https://wsrv.nl"
    quality: 85
    widths: [480, 768, 1100]
    sizes: "(max-width: 40em) 92vw, 33em"

# Exclude from processing (including obfuscated drafts folder)
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - AGENTS.md
  - _x7k9p
  - .gitignore
  # Media under _posts must not be read as documents (date-prefixed .jpg names
  # match the posts filename pattern and trigger UTF-8 read errors).
  - _posts/v1-archive/media
  - _posts/v2-archive/media
  - _posts/v3-archive/media

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Jonathan Frei
  # Historical imports: no category segment in URL; media lives at /media/
  - scope:
      path: "_posts/v1-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: []
  - scope:
      path: "_posts/v2-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: []
  - scope:
      path: "_posts/v3-archive"
      type: "posts"
    values:
      permalink: /:year/:month/:day/:title
      categories: []
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# SEO / social (basic)
twitter:
  username: jonathanfrei

# Feed settings – drafts never included because excluded from build
feed:
  path: feed.xml
