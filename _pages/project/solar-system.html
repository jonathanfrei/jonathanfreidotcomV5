<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Our Solar System · Jonathan Frei</title>
  <meta name="description" content="A classroom model of the solar system. Click a world to read a short lesson. Sizes and distances are not to scale.">
  <link rel="icon" href="/assets/img/favicon.ico" type="image/png">
  <link rel="preload" href="/assets/fonts/source-serif-4-5.2.5-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/source-code-pro-5.2.5-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Source Serif 4";
      font-style: normal;
      font-display: swap;
      font-weight: 200 900;
      src: url("/assets/fonts/source-serif-4-5.2.5-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Source Code Pro";
      font-style: normal;
      font-display: swap;
      font-weight: 200 900;
      src: url("/assets/fonts/source-code-pro-5.2.5-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --color-fg: #F4F3EF;
      --color-muted: #A8B3B9;
      --color-border: #2A373E;
      --color-accent: #4AA8D4;
      --color-surface: #18262E;
      --font-body: "Source Serif 4", Charter, "Iowan Old Style", Georgia, ui-serif, serif;
      --font-ui: "Source Code Pro", "Cascadia Mono", ui-monospace, monospace;
      --radius: 0.25rem;
      --space-4: 1.4rem;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      background: #05070d;
      color: var(--color-fg);
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 1.0625rem;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      top: -100%;
    }

    .solar-stage {
      position: relative;
      height: 100dvh;
      background: #05070d;
      overflow: hidden;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #scene:active { cursor: grabbing; }

    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .world-label {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f4f3ef;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      opacity: 0.88;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
    }

    .world-label.is-hidden { visibility: hidden; }

    .world-label.is-selected {
      opacity: 1;
      color: #fff;
    }

    .mast {
      position: absolute;
      top: var(--space-4);
      left: var(--space-4);
      z-index: 4;
      color: #f4f3ef;
      max-width: 22ch;
      pointer-events: none;
    }

    .mast .eyebrow {
      margin: 0 0 0.35rem;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a8b3b9;
    }

    .mast h1 {
      margin: 0;
      font-family: var(--font-body);
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 400;
      line-height: 1.15;
      color: #f4f3ef;
    }

    .mast .sub {
      margin: 0.4rem 0 0;
      color: #c5ced3;
      font-size: 0.95rem;
    }

    .lesson {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 4;
      width: min(20.5rem, calc(100vw - 2.5rem));
      max-height: calc(100% - 11rem);
      overflow: auto;
      background: var(--color-surface);
      color: var(--color-fg);
      font-family: var(--font-body);
      padding: 1.15rem 1.2rem 1.05rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }

    body.is-immersed .lesson,
    .lesson[hidden] {
      display: none !important;
    }

    .lesson .kicker {
      margin: 0 0 0.4rem;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .lesson h2 {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.65rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .lesson .lede {
      margin: 0.55rem 0 0;
      font-size: 1rem;
      line-height: 1.4;
    }

    .lesson .hint {
      margin: 1rem 0 0;
      color: var(--color-muted);
      font-size: 0.9rem;
    }

    .lesson .facts {
      margin: 0.9rem 0 0;
      padding: 0 0 0 1.15rem;
      display: grid;
      gap: 0.55rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .lesson .facts li::marker {
      color: var(--color-accent);
    }

    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      padding: 0.75rem 1rem 1rem;
      background: linear-gradient(to top, rgba(11, 17, 21, 0.92), rgba(11, 17, 21, 0));
      color: #f4f3ef;
    }

    .scale-note {
      margin: 0 0 0.6rem;
      font-size: 0.85rem;
      color: #c5ced3;
      max-width: 46rem;
    }

    .roster-wrap {
      overflow-x: auto;
      margin-bottom: 0.6rem;
    }

    .roster {
      display: flex;
      gap: 0.4rem;
      min-width: max-content;
      padding-bottom: 0.2rem;
    }

    .world-chip {
      appearance: none;
      border: 1px solid var(--color-border);
      background: #18262e;
      color: #f4f3ef;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.55rem 0.7rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      border-radius: var(--radius);
    }

    .world-chip:hover,
    .world-chip:focus-visible {
      border-color: var(--color-accent);
      outline: none;
    }

    .world-chip.is-active {
      background: #f4f3ef;
      color: #111C24;
      border-color: var(--color-accent);
    }

    .swatch {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.8rem;
      align-items: center;
    }

    .ctrl {
      appearance: none;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-fg);
      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 44px;
      padding: 0 0.85rem;
      cursor: pointer;
      border-radius: var(--radius);
      text-decoration: none;
    }

    a.ctrl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-home {
      width: 44px;
      padding: 0;
    }

    .ctrl-home svg {
      display: block;
      width: 1.15rem;
      height: 1.15rem;
    }

    .ctrl:hover,
    .ctrl:focus-visible {
      border-color: var(--color-accent);
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      color: var(--color-fg);
    }

    .speed {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      color: #c5ced3;
    }

    .speed input {
      width: 7.5rem;
      accent-color: var(--color-accent);
    }

    @media (max-width: 50em) {
      .mast { max-width: 55vw; }
      .mast h1 { font-size: 1.25rem; }
      .mast .sub { font-size: 0.8rem; }
      .scale-note { display: none; }
      .lesson {
        top: auto;
        bottom: 11.25rem;
        right: 0.75rem;
        left: 0.75rem;
        width: auto;
        max-height: 22vh;
        padding: 0.7rem 0.8rem 0.65rem;
        z-index: 5;
      }
      .lesson .kicker { font-size: 0.58rem; margin-bottom: 0.2rem; }
      .lesson h2 { font-size: 1.05rem; }
      .lesson .lede { font-size: 0.8rem; margin-top: 0.3rem; }
      .lesson .hint { font-size: 0.75rem; margin-top: 0.45rem; }
      .lesson .facts { font-size: 0.78rem; gap: 0.3rem; margin-top: 0.45rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="solar-stage">
    <canvas id="scene"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <header class="mast">
      <p class="eyebrow">Classroom sky</p>
      <h1 id="title">Our Solar System</h1>
      <p id="subtitle" class="sub">Click a world. Learn what it is like.</p>
    </header>

    <aside id="lesson" class="lesson" aria-live="polite"></aside>

    <div class="dock">
      <p id="scale-note" class="scale-note"></p>
      <div class="roster-wrap">
        <div id="roster" class="roster" role="list"></div>
      </div>
      <div class="controls">
        <button id="play" type="button" class="ctrl">Pause</button>
        <label class="speed">
          Speed
          <input id="speed" type="range" min="0.2" max="8" step="0.2" value="1">
          <span id="speed-value">1.0×</span>
        </label>
        <button id="labels-toggle" type="button" class="ctrl">Hide names</button>
        <button id="reset" type="button" class="ctrl">Show all</button>
        <a class="ctrl ctrl-home" href="/" aria-label="Home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"/>
            <path d="M5.5 10.5V20h13v-9.5"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "/project/solar-system/lib/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="/project/solar-system/app.js"></script>
</body>
</html>
