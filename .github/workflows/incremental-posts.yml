# Post-only content updates on main (#64).
#
# - Edit existing post(s)  → jekyll build --incremental (warm _site cache)
# - Add or delete post(s)  → full jekyll build (cascade pages / no stale HTML)
# - Archive media only     → workflow does not run (jsDelivr; path filters)
#
# Full deploy.yml still covers layouts/CSS/config, schedule, and workflow_dispatch.
name: Incremental posts deploy

on:
  push:
    branches: ["main"]
    paths:
      - "_posts/**"
      - "!_posts/**/media/**"
      - "!_posts/v1-archive/media/**"
      - "!_posts/v2-archive/media/**"
      - "!_posts/v3-archive/media/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Classify post changes
        id: scope
        run: |
          set -euo pipefail

          # mode: skip | incremental | full
          mode=incremental

          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "No parent commit — full build."
            mode=full
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          mapfile -t added < <(git diff --name-only --diff-filter=A HEAD^ HEAD)
          mapfile -t deleted < <(git diff --name-only --diff-filter=D HEAD^ HEAD)

          is_post_md() {
            local f="$1"
            case "$f" in
              _posts/*) ;;
              *) return 1 ;;
            esac
            case "$f" in
              */media/*) return 1 ;;
            esac
            case "$f" in
              *.md|*.markdown|*.html) return 0 ;;
              *) return 1 ;;
            esac
          }

          non_post=0
          for f in "${changed[@]}"; do
            case "$f" in
              _posts/*)
                case "$f" in
                  */media/*) continue ;;
                esac
                ;;
              *)
                echo "Non-post path in commit: $f"
                non_post=1
                ;;
            esac
          done

          if [ "$non_post" -eq 1 ]; then
            echo "Commit touches more than _posts content — full deploy.yml handles this."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in "${added[@]}"; do
            if is_post_md "$f"; then
              echo "New post content: $f → full build"
              mode=full
            fi
          done

          for f in "${deleted[@]}"; do
            if is_post_md "$f"; then
              echo "Deleted post content: $f → full build"
              mode=full
            fi
          done

          if [ "$mode" = "incremental" ]; then
            echo "Post edit(s) only → incremental build"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        if: steps.scope.outputs.mode != 'skip'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        if: steps.scope.outputs.mode != 'skip'
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Jekyll site cache
        if: steps.scope.outputs.mode != 'skip'
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            .jekyll-metadata
            _site
          key: jekyll-site-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.sha }}
          restore-keys: |
            jekyll-site-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-
            jekyll-site-${{ runner.os }}-

      - name: Build with Jekyll (incremental — edits only)
        if: steps.scope.outputs.mode == 'incremental'
        run: |
          set -euo pipefail
          bundle exec jekyll build \
            --incremental \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn

      - name: Build with Jekyll (full — new or deleted posts)
        if: steps.scope.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # Drop stale site output so a full rebuild cannot leave deleted posts behind.
          rm -rf _site
          rm -f .jekyll-metadata
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn

      - name: Report artifact size
        if: steps.scope.outputs.mode != 'skip'
        run: |
          du -sh _site
          if [ -d _site/media ]; then
            echo "::error::_site/media should not exist in CDN mode (would bloat Pages deploy)"
            du -sh _site/media
            exit 1
          fi
          echo "OK: archive media not bundled; mode=${{ steps.scope.outputs.mode }}"
          if [ -f .jekyll-metadata ]; then
            echo "Jekyll metadata present ($(wc -c < .jekyll-metadata) bytes)"
          else
            echo "No .jekyll-metadata"
          fi

      - name: Upload artifact
        if: steps.scope.outputs.mode != 'skip'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.scope.outputs.mode != 'skip'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          error_count: 20
          reporting_interval: 10000
