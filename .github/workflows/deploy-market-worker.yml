name: Deploy market and image worker

on:
  push:
    branches: [main]
    paths:
      - "workers/img-proxy/**"
      - ".github/workflows/deploy-market-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Cloudflare account
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          account_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}" | jq --raw-output '.result.account.id')"
          test -n "${account_id}" && test "${account_id}" != "null"
          echo "account_id=${account_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Worker
        working-directory: workers/img-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx --yes wrangler@4.127.1 deploy
