name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    # Drafts/docs-only commits should not rebuild (#29).
    paths-ignore:
      - "_x7k9p/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  # No schedule — publish future-dated posts with a content push or workflow_dispatch (#142).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so post_metadata.rb can set last_modified_at from git (#75).
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        id: jekyll
        # Archive media is served from S3 (media.jonathanfrei.com; see
        # archive_media in _config.yml and _plugins/fix_archive_media.rb, #170).
        # Do not bundle media into the Pages artifact — deploy-pages hard-caps
        # wait at 10 minutes. Full build keeps cascade pages coherent.
        run: |
          set -euo pipefail
          start=$(date +%s)
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          end=$(date +%s)
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "Built in $((end - start))s"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn
          # Match _config.yml timezone so permalinks/bylines stay Eastern (#180).
          TZ: America/New_York

      - name: Report build metrics
        # Duration, payload size, and a search.json contract (#195).
        # Warn budgets are guardrails; only an oversized search index fails.
        env:
          BUILD_SECONDS: ${{ steps.jekyll.outputs.seconds }}
        run: |
          set -euo pipefail
          echo "Build duration: ${BUILD_SECONDS}s"
          du -sh _site
          if [ -f _site/search.json ]; then
            echo "search.json: $(wc -c < _site/search.json) bytes"
          else
            echo "::error::Missing _site/search.json"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys

          path = "_site/search.json"
          size = os.path.getsize(path)
          seconds = int(os.environ.get("BUILD_SECONDS") or 0)
          warn_bytes = 600_000
          fail_bytes = 1_500_000
          warn_secs = 600
          allowed = {"kind", "title", "url", "date", "excerpt", "tags", "categories"}
          required = {"title", "url", "date"}
          bad = 0

          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          if not isinstance(data, list):
              print("::error::search.json must be a JSON array")
              sys.exit(1)
          print(f"search.json entries: {len(data)}")

          sample = data[:50]
          for i, item in enumerate(sample):
              if not isinstance(item, dict):
                  print(f"::error::search.json[{i}] is not an object")
                  bad = 1
                  continue
              extra = set(item) - allowed
              missing = required - set(item)
              if extra:
                  print(f"::error::search.json[{i}] unexpected fields: {sorted(extra)}")
                  bad = 1
              if missing:
                  print(f"::error::search.json[{i}] missing fields: {sorted(missing)}")
                  bad = 1

          if size > fail_bytes:
              print(f"::error::search.json is {size} bytes (fail budget {fail_bytes})")
              bad = 1
          elif size > warn_bytes:
              print(f"::warning::search.json is {size} bytes (warn budget {warn_bytes})")
          else:
              print(f"OK: search.json within budget ({size} <= {warn_bytes})")

          if seconds > warn_secs:
              print(f"::warning::build took {seconds}s (warn budget {warn_secs}s)")
          else:
              print(f"OK: build duration {seconds}s")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Build metrics\n\n")
                  fh.write(f"- Duration: **{seconds}s**\n")
                  fh.write(f"- search.json: **{size} bytes**, {len(data)} entries\n")
                  fh.write(f"- Budget: warn {warn_bytes} B / fail {fail_bytes} B; warn {warn_secs}s\n")

          sys.exit(bad)
          PY

      - name: Report artifact size
        run: |
          set -euo pipefail
          du -sh _site
          # Only the archive media publish root (and mirrored archive paths)
          # must stay out of the artifact. Individual tag archives are gone
          # (#209), so _site/tags/ should not exist at all.
          bad=0
          if [ -d _site/media ]; then
            echo "::error::_site/media should not exist in CDN mode (would bloat Pages deploy)"
            du -sh _site/media
            bad=1
          fi
          for p in _site/_posts/v1-archive/media _site/_posts/v2-archive/media _site/_posts/v3-archive/media; do
            if [ -d "$p" ]; then
              echo "::error::Unexpected archive media tree in artifact: $p"
              du -sh "$p"
              bad=1
            fi
          done
          # Spot-check that archive posts rewrite media/ to S3 (#170), not jsDelivr.
          if ! grep -Rql 'media.jonathanfrei.com/v[23]-archive/media/' _site --include='*.html'; then
            echo "::error::Expected S3 archive media URLs (media.jonathanfrei.com) in built HTML"
            bad=1
          else
            echo "OK: S3 archive media URLs present in HTML"
          fi
          if grep -Rql 'cdn.jsdelivr.net/gh/.*/_posts/v[123]-archive/media/' _site --include='*.html'; then
            echo "::error::Legacy jsDelivr archive media URLs still present in HTML"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "OK: archive media not bundled; artifact is HTML/CSS/JS only"

      - name: Check permalink convention
        # Light guard for #63 / audit #103: non-paginated pages must be .html
        # files so GitHub Pages serves clean URLs. /blog page 1 is blog.html;
        # later blog pages and month archives use directory/index.html.
        run: |
          set -euo pipefail
          missing=0

          for f in index.html about.html tags.html search.html search.json; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Missing expected page: _site/$f (permalink regression?)"
              missing=1
            else
              echo "OK: _site/$f"
            fi
          done

          if [ -f _site/typography.html ]; then
            if grep -q 'highlighter-rouge' _site/typography.html; then
              echo "OK: Rouge highlighting on typography page"
            else
              echo "::error::typography page should contain Rouge markup (highlighter-rouge)"
              missing=1
            fi
            if grep -q 'class="CodeRay"' _site/typography.html; then
              echo "::error::CodeRay markup still present on typography page"
              missing=1
            fi
          fi

          if [ -f "_site/blog.html" ]; then
            echo "OK: _site/blog.html"
          else
            echo "::error::Missing _site/blog.html (permalink must be /blog, not /blog/)"
            missing=1
          fi
          if [ -f "_site/blog/index.html" ]; then
            echo "::error::_site/blog/index.html should not exist (trailing-slash /blog/)"
            missing=1
          fi

          # Use the July fixture: it is always in the past, so Jekyll writes
          # the permalink even if `future` is later turned off.
          if [ -f "_site/2026/07/01/example-domain.html" ]; then
            echo "OK: _site/2026/07/01/example-domain.html"
          else
            echo "::error::Missing sample link permalink _site/2026/07/01/example-domain.html"
            missing=1
          fi

          if [ ! -f _site/assets/css/core.css ]; then
            echo "::error::Missing _site/assets/css/core.css"
            missing=1
          else
            echo "OK: _site/assets/css/core.css"
          fi

          # Every page links /assets/css/core.css (PR #208). Do not inline main.css.
          for sample in _site/blog.html _site/index.html _site/about.html \
            _site/2009/08/29/getting-started.html _site/blog/page/2/index.html; do
            if [ ! -f "$sample" ]; then
              continue
            fi
            if grep -q '/assets/css/core.css' "$sample"; then
              echo "OK: $sample links core.css"
            else
              echo "::error::$sample should link /assets/css/core.css"
              missing=1
            fi
            if grep -q -- '--brand-paper:' "$sample"; then
              echo "::error::$sample should not inline main.css"
              missing=1
            fi
          done
          if [ -f _site/editorial/design-system.html ]; then
            if grep -q '/assets/css/editorial.css' _site/editorial/design-system.html; then
              echo "OK: editorial page links editorial.css"
            else
              echo "::error::_site/editorial/design-system.html should link /assets/css/editorial.css"
              missing=1
            fi
          fi
          if [ -d _site/blog/page/50 ]; then
            echo "::error::blog pagination should use 50 per page (no /blog/page/50)"
            missing=1
          else
            echo "OK: no /blog/page/50 (50 per page)"
          fi
          if [ -d _site/tags ]; then
            echo "::error::_site/tags/ should not exist; tag archives are search URLs (#209)"
            missing=1
          else
            echo "OK: no individual tag archive pages"
          fi
          if [ -f _site/tags.html ]; then
            if grep -q 'search-ui' _site/tags.html && grep -q '?tag=' _site/tags.html; then
              echo "OK: /tags uses search UI and ?tag= chip links"
            else
              echo "::error::_site/tags.html should include search UI and ?tag= chip links"
              missing=1
            fi
          fi
          if [ -f _site/assets/js/search.js ]; then
            if grep -q 'params.get("tag")' _site/assets/js/search.js && grep -q 'params.get("q")' _site/assets/js/search.js; then
              echo "OK: search.js reads q/tag URL params"
            else
              echo "::error::search.js should read ?q= and ?tag= URL params"
              missing=1
            fi
            if grep -q 'userTyped' _site/assets/js/search.js; then
              echo "OK: search.js keeps URL params until the user types"
            else
              echo "::error::search.js should treat the query string as source of truth until input"
              missing=1
            fi
          fi
          if [ -f _site/search.html ]; then
            if grep -q 'search-landing' _site/search.html && grep -q 'min-height: 55vh' _site/search.html; then
              echo "OK: /search reserves result space to limit CLS"
            else
              echo "::error::_site/search.html should reserve min-height for search results"
              missing=1
            fi
            if grep -q '#tags-list' _site/search.html && grep -q 'display: none' _site/search.html; then
              echo "::error::search CSS should not hide the tag or archive lists"
              missing=1
            else
              echo "OK: search does not hide tag/archive lists"
            fi
          fi
          if [ -f _site/tags.html ]; then
            if grep -q 'URLSearchParams' _site/tags.html && grep -q 'search.js?v=' _site/tags.html && grep -q 'defer' _site/tags.html; then
              echo "OK: /tags inlines URL seed, defers search.js, and cache-busts it"
            else
              echo "::error::_site/tags.html should inline a URL seed and defer search.js?v="
              missing=1
            fi
          fi

          blog_page="_site/blog.html"
          if [ -f "$blog_page" ]; then
            if grep -q '?tag=' "$blog_page"; then
              echo "OK: $blog_page tag chips use search URLs"
            else
              echo "::error::$blog_page tag chips should link to /tags?tag="
              missing=1
            fi
            if grep -q 'class="stream-post__body"' "$blog_page"; then
              echo "::error::$blog_page should excerpt posts, not render full bodies"
              missing=1
            fi
            if ! grep -q 'class="read-more"' "$blog_page"; then
              echo "::error::$blog_page should include Read more links on post entries"
              missing=1
            fi
            if grep -q 'feed-filter' "$blog_page"; then
              echo "::error::$blog_page should not include the All/Posts/Links filter"
              missing=1
            fi
          fi

          for stale in posts.xml links.xml posts/index.html links/index.html; do
            if [ -f "_site/$stale" ]; then
              echo "::error::Stale feed or index should be gone: _site/$stale"
              missing=1
            fi
          done

          if [ ! -f "_site/feed.xml" ]; then
            echo "::error::Missing feed: _site/feed.xml"
            missing=1
          else
            echo "OK: _site/feed.xml"
            if grep -q 'link-card' _site/feed.xml; then
              echo "::error::feed.xml must not include URL card markup"
              missing=1
            fi
            if grep -q '>Permalink</a>' _site/feed.xml; then
              echo "::error::RSS should use a permalink glyph, not the word Permalink"
              missing=1
            fi
          fi

          if [ -f "_site/posts.html" ]; then
            if grep -q 'Redirecting' _site/posts.html && grep -q '/blog' _site/posts.html; then
              echo "OK: _site/posts.html redirects to /blog"
            else
              echo "::error::_site/posts.html should redirect to /blog"
              missing=1
            fi
          fi
          if [ -f "_site/links.html" ]; then
            if grep -q 'Redirecting' _site/links.html && grep -q '/blog' _site/links.html; then
              echo "OK: _site/links.html redirects to /blog"
            else
              echo "::error::_site/links.html should redirect to /blog"
              missing=1
            fi
          fi

          if [ -d _site/categories ]; then
            echo "::error::_site/categories/ should not exist; category archives are search URLs"
            missing=1
          else
            echo "OK: no individual category archive pages"
          fi
          if [ -f _site/categories.html ]; then
            if grep -q 'search-ui' _site/categories.html && grep -q '?category=' _site/categories.html; then
              echo "OK: /categories uses search UI and ?category= chip links"
            else
              echo "::error::_site/categories.html should include search UI and ?category= chip links"
              missing=1
            fi
          fi
          if [ -f _site/search.json ]; then
            if python3 -c 'import json,sys; d=json.load(open("_site/search.json",encoding="utf-8")); sys.exit(0 if d and "categories" in d[0] else 1)'; then
              echo "OK: search.json includes categories"
            else
              echo "::error::search.json entries should include a categories field"
              missing=1
            fi
          fi

          if [ -f "_site/build-errors.log" ]; then
            echo "---- build-errors.log ----"
            cat _site/build-errors.log
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          post_html=$(find _site -mindepth 4 -maxdepth 4 -type f -name '*.html' | head -1 || true)
          if [ -z "$post_html" ]; then
            echo "::warning::No sample post HTML found under _site/YYYY/MM/DD/ (may be empty site)"
          else
            echo "OK: sample post HTML $post_html"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages hard-caps wait timeout at 10 minutes (MAX_TIMEOUT=600000).
    # Archive media is on S3 (media.jonathanfrei.com) so this stays under the limit.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          error_count: 20
          reporting_interval: 10000
