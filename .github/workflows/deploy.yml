name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    # Docs-only commits should not rebuild (#29).
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  # No schedule — publish future-dated posts with a content push or workflow_dispatch (#142).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run plugin tests
        run: |
          set -euo pipefail
          ruby -Itest -e 'Dir.glob("test/test_*.rb") { |f| require File.expand_path(f) }'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so post_metadata.rb can set last_modified_at from git (#75).
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore link-card cache
        # _plugins/link_posts.rb fetches link-card OG metadata over HTTP (4s
        # timeout) into .jekyll-cache/link-cards, but .gitignore ignores
        # .jekyll-cache and CI persists nothing — so every build re-fetches
        # all cards. Key on _posts content with a prefix fallback.
        uses: actions/cache@v5
        with:
          path: .jekyll-cache/link-cards
          key: link-cards-${{ hashFiles('_posts/**/*.md') }}
          restore-keys: |
            link-cards-

      - name: Build with Jekyll
        id: jekyll
        # Archive media is served from S3 (media.jonathanfrei.com; see
        # archive_media in _config.yml and _plugins/fix_archive_media.rb, #170).
        # Do not bundle media into the Pages artifact — deploy-pages hard-caps
        # wait at 10 minutes. Full build keeps cascade pages coherent.
        run: |
          set -euo pipefail
          if [ -z "${IMG_HMAC:-}" ]; then
            echo "::error::IMG_HMAC secret is required (same value as the img-proxy Worker secret)"
            exit 1
          fi
          start=$(date +%s)
          echo "link-cards cache: $(ls .jekyll-cache/link-cards 2>/dev/null | wc -l || true) entries"
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          end=$(date +%s)
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "Built in $((end - start))s"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn
          # HMAC for /img Worker URLs. Must match the Worker secret IMG_HMAC.
          IMG_HMAC: ${{ secrets.IMG_HMAC }}
          # Match _config.yml timezone so permalinks/bylines stay Eastern (#180).
          TZ: America/New_York

      - name: Report build metrics
        # Duration, payload size, and a search.json contract (#195, #219).
        # Warn budgets are guardrails; only an oversized search index fails.
        env:
          BUILD_SECONDS: ${{ steps.jekyll.outputs.seconds }}
        run: |
          set -euo pipefail
          echo "Build duration: ${BUILD_SECONDS}s"
          du -sh _site
          if [ -f _site/search.json ]; then
            echo "search.json: $(wc -c < _site/search.json) bytes"
          else
            echo "::error::Missing _site/search.json"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys

          path = "_site/search.json"
          size = os.path.getsize(path)
          seconds = int(os.environ.get("BUILD_SECONDS") or 0)
          warn_bytes = 600_000
          fail_bytes = 1_500_000
          warn_secs = 600
          allowed = {
              "kind",
              "title",
              "url",
              "date",
              "date_label",
              "excerpt",
              "tags",
              "categories",
              "img",
          }
          required = {"title", "url", "date", "date_label"}
          bad = 0

          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          if not isinstance(data, list):
              print("::error::search.json must be a JSON array")
              sys.exit(1)
          print(f"search.json entries: {len(data)}")

          sample = data[:50]
          for i, item in enumerate(sample):
              if not isinstance(item, dict):
                  print(f"::error::search.json[{i}] is not an object")
                  bad = 1
                  continue
              extra = set(item) - allowed
              missing = required - set(item)
              if extra:
                  print(f"::error::search.json[{i}] unexpected fields: {sorted(extra)}")
                  bad = 1
              if missing:
                  print(f"::error::search.json[{i}] missing fields: {sorted(missing)}")
                  bad = 1
              img = item.get("img")
              if img is not None and (
                  not isinstance(img, dict) or not str(img.get("src") or "").strip()
              ):
                  print(f"::error::search.json[{i}] img must be an object with src")
                  bad = 1

          if size > fail_bytes:
              print(f"::error::search.json is {size} bytes (fail budget {fail_bytes})")
              bad = 1
          elif size > warn_bytes:
              print(f"::warning::search.json is {size} bytes (warn budget {warn_bytes})")
          else:
              print(f"OK: search.json within budget ({size} <= {warn_bytes})")

          if seconds > warn_secs:
              print(f"::warning::build took {seconds}s (warn budget {warn_secs}s)")
          else:
              print(f"OK: build duration {seconds}s")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Build metrics\n\n")
                  fh.write(f"- Duration: **{seconds}s**\n")
                  fh.write(f"- search.json: **{size} bytes**, {len(data)} entries\n")
                  fh.write(f"- Budget: warn {warn_bytes} B / fail {fail_bytes} B; warn {warn_secs}s\n")

          sys.exit(bad)
          PY

      - name: Report artifact size
        run: |
          set -euo pipefail
          du -sh _site
          python3 scripts/ci_checks.py

      - name: Check permalink convention
        # Light guard for #63 / audit #103: non-paginated pages must be .html
        # files so GitHub Pages serves clean URLs. /blog page 1 is blog.html;
        # later blog pages and month archives use directory/index.html.
        run: |
          set -euo pipefail
          python3 scripts/ci_checks.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages hard-caps wait timeout at 10 minutes (MAX_TIMEOUT=600000).
    # Archive media is on S3 (media.jonathanfrei.com) so this stays under the limit.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          error_count: 20
          reporting_interval: 10000

      # HTML is Cache-Everything at Cloudflare (2h edge TTL). Purge so the
      # next visitor does not keep the pre-deploy homepage for two hours.
      # Secrets are optional: forks and first-time setups skip this step.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ZONE}" ] || [ -z "${CF_TOKEN}" ]; then
            echo "Skipping Cloudflare purge (CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN not set)"
            exit 0
          fi
          resp="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "${resp}"
          printf '%s' "${resp}" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("success") else 1)'
