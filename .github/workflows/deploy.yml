name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    # Commits that only touch drafts/docs should not rebuild (#29).
    # Pure _posts content updates are handled by incremental-posts.yml (#64).
    paths-ignore:
      - "_x7k9p/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
      - "_posts/**"
  schedule:
    # Rebuild periodically so future-dated posts get published
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Jekyll site cache
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-metadata
            _site
          key: jekyll-site-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.sha }}
          restore-keys: |
            jekyll-site-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-
            jekyll-site-${{ runner.os }}-

      - name: Build with Jekyll
        # Archive media is served from jsDelivr (see archive_media in _config.yml
        # and _plugins/fix_archive_media.rb). Do not bundle ~200MB of images into
        # the Pages artifact — deploy-pages hard-caps wait at 10 minutes.
        # Full (non-incremental) build keeps cascade pages and plugin output coherent.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn

      - name: Report artifact size
        run: |
          du -sh _site
          if [ -d _site/media ]; then
            echo "::error::_site/media should not exist in CDN mode (would bloat Pages deploy)"
            du -sh _site/media
            exit 1
          fi
          echo "OK: archive media not bundled; artifact is HTML/CSS/JS only"

      - name: Check permalink convention
        # Light guard for #63 / audit #103: non-paginated pages must be .html
        # files so GitHub Pages serves clean URLs. Paginated pages (blog) and
        # month archives intentionally use directory/index.html.
        run: |
          set -euo pipefail
          missing=0

          # Flat .html pages (no pagination)
          for f in index.html about.html tags.html search.html; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Missing expected HTML page: _site/$f (permalink regression?)"
              missing=1
            else
              echo "OK: _site/$f"
            fi
          done

          # Paginated blog: jekyll-paginate-v2 writes blog/index.html (or blog.html)
          if [ -f "_site/blog.html" ]; then
            echo "OK: _site/blog.html"
          elif [ -f "_site/blog/index.html" ]; then
            echo "OK: _site/blog/index.html (paginated)"
          else
            echo "::error::Missing blog page (expected _site/blog.html or _site/blog/index.html)"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Spot-check one post path pattern (year/month/day/slug.html)
          post_html=$(find _site -mindepth 4 -maxdepth 4 -type f -name '*.html' | head -1 || true)
          if [ -z "$post_html" ]; then
            echo "::warning::No sample post HTML found under _site/YYYY/MM/DD/ (may be empty site)"
          else
            echo "OK: sample post HTML $post_html"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages hard-caps wait timeout at 10 minutes (MAX_TIMEOUT=600000).
    # Archive media is offloaded to jsDelivr so this stays well under the limit.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 10; allow a few more transient status-check failures
          error_count: 20
          reporting_interval: 10000
