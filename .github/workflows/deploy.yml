name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    # Commits that only touch obfuscated drafts (or docs) should not rebuild the site (#29)
    paths-ignore:
      - "_x7k9p/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  schedule:
    # Rebuild periodically so future-dated posts get published
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # Archive media is served from jsDelivr (see archive_media in _config.yml
        # and _plugins/fix_archive_media.rb). Do not bundle ~200MB of images into
        # the Pages artifact — deploy-pages hard-caps wait at 10 minutes.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn

      - name: Report artifact size
        run: |
          du -sh _site
          if [ -d _site/media ]; then
            echo "::error::_site/media should not exist in CDN mode (would bloat Pages deploy)"
            du -sh _site/media
            exit 1
          fi
          echo "OK: archive media not bundled; artifact is HTML/CSS/JS only"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages hard-caps wait timeout at 10 minutes (MAX_TIMEOUT=600000).
    # Archive media is offloaded to jsDelivr so this stays well under the limit.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 10; allow a few more transient status-check failures
          error_count: 20
          reporting_interval: 10000
