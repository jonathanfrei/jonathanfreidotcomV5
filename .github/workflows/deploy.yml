name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
    # Drafts/docs-only commits should not rebuild (#29).
    paths-ignore:
      - "_x7k9p/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  # No schedule — publish future-dated posts with a content push or workflow_dispatch (#142).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so post_metadata.rb can set last_modified_at from git (#75).
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # Archive media is served from S3 (media.jonathanfrei.com; see
        # archive_media in _config.yml and _plugins/fix_archive_media.rb, #170).
        # Do not bundle media into the Pages artifact — deploy-pages hard-caps
        # wait at 10 minutes. Full build keeps cascade pages coherent.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          ARCHIVE_MEDIA_MODE: cdn
          # Match _config.yml timezone so permalinks/bylines stay Eastern (#180).
          TZ: America/New_York

      - name: Report artifact size
        run: |
          set -euo pipefail
          du -sh _site
          # Only the archive media publish root (and mirrored archive paths)
          # must stay out of the artifact. Do NOT match tag pages such as
          # _site/tags/media — those are HTML autopages, not binary media.
          bad=0
          if [ -d _site/media ]; then
            echo "::error::_site/media should not exist in CDN mode (would bloat Pages deploy)"
            du -sh _site/media
            bad=1
          fi
          for p in _site/_posts/v1-archive/media _site/_posts/v2-archive/media _site/_posts/v3-archive/media; do
            if [ -d "$p" ]; then
              echo "::error::Unexpected archive media tree in artifact: $p"
              du -sh "$p"
              bad=1
            fi
          done
          # Spot-check that archive posts rewrite media/ to S3 (#170), not jsDelivr.
          if ! grep -Rql 'media.jonathanfrei.com/v[23]-archive/media/' _site --include='*.html'; then
            echo "::error::Expected S3 archive media URLs (media.jonathanfrei.com) in built HTML"
            bad=1
          else
            echo "OK: S3 archive media URLs present in HTML"
          fi
          if grep -Rql 'cdn.jsdelivr.net/gh/.*/_posts/v[123]-archive/media/' _site --include='*.html'; then
            echo "::error::Legacy jsDelivr archive media URLs still present in HTML"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "OK: archive media not bundled; artifact is HTML/CSS/JS only"
          # Note: _site/tags/media is a tag page for the 'media' tag — expected.

      - name: Check permalink convention
        # Light guard for #63 / audit #103: non-paginated pages must be .html
        # files so GitHub Pages serves clean URLs. Paginated pages (blog) and
        # month archives intentionally use directory/index.html.
        run: |
          set -euo pipefail
          missing=0

          for f in index.html about.html tags.html search.html; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Missing expected HTML page: _site/$f (permalink regression?)"
              missing=1
            else
              echo "OK: _site/$f"
            fi
          done

          if [ -f "_site/blog.html" ]; then
            echo "OK: _site/blog.html"
          elif [ -f "_site/blog/index.html" ]; then
            echo "OK: _site/blog/index.html (paginated)"
          else
            echo "::error::Missing blog page (expected _site/blog.html or _site/blog/index.html)"
            missing=1
          fi

          if [ -f "_site/links.html" ]; then
            echo "OK: _site/links.html"
          elif [ -f "_site/links/index.html" ]; then
            echo "OK: _site/links/index.html (paginated)"
          else
            echo "::error::Missing links page (expected _site/links.html or _site/links/index.html)"
            missing=1
          fi

          # Use the July fixture: it is always in the past, so Jekyll writes
          # the permalink even if `future` is later turned off.
          if [ -f "_site/2026/07/01/example-domain.html" ]; then
            echo "OK: _site/2026/07/01/example-domain.html"
          else
            echo "::error::Missing sample link permalink _site/2026/07/01/example-domain.html"
            missing=1
          fi

          posts_page=""
          if [ -f "_site/posts.html" ]; then
            posts_page="_site/posts.html"
            echo "OK: _site/posts.html"
          elif [ -f "_site/posts/index.html" ]; then
            posts_page="_site/posts/index.html"
            echo "OK: _site/posts/index.html (paginated)"
          else
            echo "::error::Missing posts page (expected _site/posts.html or _site/posts/index.html)"
            missing=1
          fi

          if [ -n "$posts_page" ]; then
            if grep -q 'class="links-year"' "$posts_page"; then
              echo "::error::$posts_page should not use the /links year grouping"
              missing=1
            fi
            if ! grep -q 'class="stream-post__title"' "$posts_page"; then
              echo "::error::$posts_page should show full post titles"
              missing=1
            fi
            if ! grep -q 'class="read-more"' "$posts_page"; then
              echo "::error::$posts_page should include Read more links to permalinks"
              missing=1
            fi
          fi

          blog_page=""
          if [ -f "_site/blog.html" ]; then
            blog_page="_site/blog.html"
          elif [ -f "_site/blog/index.html" ]; then
            blog_page="_site/blog/index.html"
          fi
          if [ -n "$blog_page" ]; then
            if grep -q 'class="stream-post__body"' "$blog_page"; then
              echo "::error::$blog_page should excerpt posts, not render full bodies"
              missing=1
            fi
            if ! grep -q 'class="read-more"' "$blog_page"; then
              echo "::error::$blog_page should include Read more links on post entries"
              missing=1
            fi
          fi

          for feed in feed.xml posts.xml links.xml; do
            if [ ! -f "_site/$feed" ]; then
              echo "::error::Missing feed: _site/$feed"
              missing=1
            else
              echo "OK: _site/$feed"
            fi
          done

          if [ -f "_site/links.xml" ]; then
            if ! grep -q 'https://en.wikipedia.org/wiki/RSS' _site/links.xml; then
              echo "::error::links.xml should guid/link the Wikipedia fixture URL"
              missing=1
            fi
            # Body-only phrase (not in excerpt). Avoid apostrophes: the
            # fixture uses a curly quote and Kramdown may emit &rsquo;.
            if ! grep -q "dedicated links feed" _site/links.xml; then
              echo "::error::links.xml should include full link body content"
              missing=1
            fi
            if grep -q '>Permalink</a>' _site/links.xml _site/feed.xml; then
              echo "::error::RSS feeds should use a permalink glyph, not the word Permalink"
              missing=1
            fi
            if grep -q 'link-card' _site/links.xml; then
              echo "::error::links.xml must not include URL card markup"
              missing=1
            fi
            if grep -q 'link-card' _site/feed.xml; then
              echo "::error::feed.xml must not include URL card markup"
              missing=1
            fi
          fi

          if [ -f "_site/build-errors.log" ]; then
            echo "---- build-errors.log ----"
            cat _site/build-errors.log
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          post_html=$(find _site -mindepth 4 -maxdepth 4 -type f -name '*.html' | head -1 || true)
          if [ -z "$post_html" ]; then
            echo "::warning::No sample post HTML found under _site/YYYY/MM/DD/ (may be empty site)"
          else
            echo "OK: sample post HTML $post_html"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages hard-caps wait timeout at 10 minutes (MAX_TIMEOUT=600000).
    # Archive media is on S3 (media.jonathanfrei.com) so this stays under the limit.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          error_count: 20
          reporting_interval: 10000
