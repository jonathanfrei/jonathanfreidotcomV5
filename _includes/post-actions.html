<p class="post-comment-link">
  <a href="mailto:hi+comments@jonathanfrei.com?subject={{ 'Comment on: ' | append: page.title | uri_escape }}&body={{ 'Post: ' | append: page.title | append: '%0A' | append: page.url | absolute_url | uri_escape }}">Comment</a>
  <span class="post-actions-sep" aria-hidden="true">·</span>
  <a href="https://github.com/jonathanfrei/jonathanfreidotcomV5/edit/main/{{ page.path }}" target="_blank" rel="noopener noreferrer">Edit</a>
  <span class="post-actions-sep" aria-hidden="true">·</span>
  {% comment %}
    Random post: no post list in HTML (would be N URLs on every page).
    Tiny click handler fetches shared /search.json once, then navigates (#130).
    Essays and link posts are both in the pool (#221).
  {% endcomment %}
  <a href="{{ '/blog' | relative_url }}" id="random-post-link" class="random-post-link" data-current="{{ page.url | relative_url }}" data-posts-url="{{ '/search.json' | relative_url }}">Random</a>
  <span class="post-actions-sep" aria-hidden="true">·</span>
  <a href="{{ '/blog' | relative_url }}">Blog</a>
</p>

<script>
(function () {
  var link = document.getElementById("random-post-link");
  if (!link) return;

  var current = link.getAttribute("data-current") || "";
  var postsUrl = link.getAttribute("data-posts-url") || "/search.json";
  var cacheKey = "search-json-urls-v2";
  var pending = null;

  /** Normalize search.json objects (or legacy string URLs) to a URL list. */
  function toUrls(data) {
    if (!Array.isArray(data)) return [];
    var urls = [];
    for (var i = 0; i < data.length; i++) {
      var item = data[i];
      var url = typeof item === "string" ? item : item && item.url;
      if (url) urls.push(url);
    }
    return urls;
  }

  function pickAndGo(urls) {
    var candidates = [];
    for (var i = 0; i < urls.length; i++) {
      if (urls[i] && urls[i] !== current) candidates.push(urls[i]);
    }
    if (!candidates.length) {
      window.location.href = link.getAttribute("href") || "/blog";
      return;
    }
    window.location.href =
      candidates[Math.floor(Math.random() * candidates.length)];
  }

  function loadUrls() {
    if (pending) return pending;
    try {
      var cached = sessionStorage.getItem(cacheKey);
      if (cached) {
        var parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length) {
          pending = Promise.resolve(parsed);
          return pending;
        }
      }
    } catch (e) { /* private mode / quota */ }

    pending = fetch(postsUrl, { credentials: "same-origin" })
      .then(function (res) {
        if (!res.ok) throw new Error("search.json " + res.status);
        return res.json();
      })
      .then(function (data) {
        var urls = toUrls(data);
        if (!urls.length) throw new Error("invalid search.json");
        try {
          sessionStorage.setItem(cacheKey, JSON.stringify(urls));
        } catch (e) { /* ignore */ }
        return urls;
      });
    return pending;
  }

  link.addEventListener("click", function (e) {
    e.preventDefault();
    if (link.getAttribute("aria-busy") === "true") return;
    link.setAttribute("aria-busy", "true");
    loadUrls()
      .then(pickAndGo)
      .catch(function () {
        link.removeAttribute("aria-busy");
        window.location.href = link.getAttribute("href") || "/blog";
      });
  });
})();
</script>
