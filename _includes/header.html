<header class="site-header">
  <div class="container flex items-center justify-between gap-4">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      {{ site.title }}
    </a>
    <nav class="site-nav flex gap-4" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/search/' | relative_url }}"{% if page.url == '/search/' %} aria-current="page"{% endif %}>Search</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
