<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ '/blog' | absolute_url }}">
  <meta http-equiv="refresh" content="0;url={{ '/blog' | relative_url }}">
  <script>location.replace({{ '/blog' | relative_url | jsonify }});</script>
</head>
<body>
  <p>This page has moved to <a href="{{ '/blog' | relative_url }}">the blog</a>.</p>
</body>
</html>
