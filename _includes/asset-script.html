{%- comment -%}
  Script with origin fallback when jsDelivr fails.
  Params: path (required), defer (optional truthy)
{%- endcomment -%}
{%- assign asset_href = include.path | asset_url -%}
{%- assign asset_origin = include.path | asset_origin_url -%}
<script src="{{ asset_href }}"{% if include.defer %} defer{% endif %}{% if asset_href != asset_origin %} data-fallback="{{ asset_origin }}" onerror="assetFallback(this)"{% endif %}></script>
