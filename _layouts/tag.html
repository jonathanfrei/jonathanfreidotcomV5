---
layout: default
---
<article class="prose">
  <header class="mb-6">
    <h1 class="mt-0">Tag: {{ page.tag }}</h1>
  </header>

  <ul class="post-list">
    {% for post in page.posts %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <div class="post-meta">
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
        </div>
      </li>
    {% endfor %}
  </ul>

  <p class="mt-8">
    <a href="{{ '/tags/' | relative_url }}">&larr; All tags</a>
  </p>
</article>
