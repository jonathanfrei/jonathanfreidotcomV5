---
layout: default
---
{% comment %}
  jekyll-archives month pages: page.type is 'month', page.date is a Date,
  page.posts is the matching posts. List entries match /blog (#201).
{% endcomment %}
<article class="prose">
  <header class="page-title">
    <h1>{{ page.date | date: "%B %Y" }}</h1>
  </header>

  {% include stream-list.html items=page.posts %}

  <p class="post-nav">
    <a href="{{ '/archive' | relative_url }}">&larr; All archives</a>
  </p>
</article>
